# =============================================================================
# Lint and Test Charts
# =============================================================================
# Runs on every push to any branch:
#   1. Lint changed charts (ct lint: yamllint + Yamale schema validation)
#
# Full install/e2e testing lives in the private anycred/entitle-charts-tests
# repo and gates chart PRs via the agent-tests check.
# =============================================================================
name: Lint and Test Charts

on:
  workflow_dispatch:
  push:
    branches: [ '**' ]

permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Set up Helm
        uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.12.1

      # Python is required because ct lint runs Yamale and yamllint
      - name: Set up Python
        uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.10"

      - name: Set up chart-testing
        uses: helm/chart-testing-action@0d28d3144d3a25ea2cc349d6e59901c4ff469b3b # v2.7.0

      - name: Run chart-testing (list-changed)
        id: list-changed
        run: |
          changed=$(ct list-changed --config ct.yaml --target-branch ${{ github.event.repository.default_branch }})
          if [[ -n "$changed" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run chart-testing (lint)
        if: steps.list-changed.outputs.changed == 'true'
        run: ct lint --config ct.yaml

      # Note: ct install (smoke test) is not used because the agent deployment
      # has Python-based health probes that require the real agent image.
      # Full install testing lives in anycred/entitle-charts-tests.

  # Builds the hook image (no push) when it changes, so a broken Dockerfile fails here
  # instead of in the release job on master. Smoke-tests every tool the hook scripts use.
  hook-image:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - name: Check for hook image changes
        id: changed
        run: |
          if git diff --quiet "origin/${{ github.event.repository.default_branch }}...HEAD" -- images/entitle-agent-hook; then
            echo "No hook image changes"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Buildx
        if: steps.changed.outputs.changed == 'true'
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build and smoke-test
        if: steps.changed.outputs.changed == 'true'
        run: |
          for arch in amd64 arm64; do
            docker buildx build --platform "linux/${arch}" --load -t "hook-test:${arch}" images/entitle-agent-hook
            docker run --rm --platform "linux/${arch}" --entrypoint bash "hook-test:${arch}" -c '
              set -e
              kubectl version --client
              echo "{\"a\":\"ok\"}" | jq -r .a
              [ "$(printf abc | base64 -w0)" = "YWJj" ]
              printf "%s" "2" | grep -E "^[0-9]+$"
              sed "s|^[^/]*/||" <<< "ghcr.io/anycred/x"
            '
          done
