# Secret with routing env vars — shared by DaemonSet (via envFrom) and Sidecar (via envFrom)
# Routing v2 only, which is always reverse routing: DD_*_URL point at the Entitle agent
# service, which authenticates the request by the client secret sent as the Datadog API
# key (see datadog-secret.yaml) and forwards to Datadog. The real Datadog key never
# reaches this cluster. Requires datadogIntake enabled on the proxy side.
# Routing v1 is served by datadog-proxy-configmap.yaml instead — exactly one of the
# two holds data for any given token.
#
# SecretRef path: see the matching note in datadog-proxy-configmap.yaml — created empty
# here and filled by hook-extract-job.yaml once the Job has read the token.
{{- $reverse := include "entitle-agent.datadogReverseMode" . -}}
{{- $host := include "entitle-agent.entitleHost" . -}}
{{- $hasToken := and .Values.agent.token (ne .Values.agent.token "MISSING_CUSTOMER_DATA") -}}
{{- $secretRefName := include "entitle-agent.secretRefNameValue" . -}}
{{- $isRuntimeSecretRef := and $secretRefName (not $hasToken) -}}
{{- /* datadogReverseMode alone, not its parts: it already means routing v2 with both a
       clientSecret and a host. datadog-secret.yaml gates the credential on the same
       value through datadogApiKey, so this Secret and that one are rendered together
       or not at all — the envFrom refs are optional, and nothing else would notice. */ -}}
{{- if or $reverse $isRuntimeSecretRef }}
{{- $origin := printf "https://%s" $host }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "entitle-agent.fullname" . }}-datadog-routing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "entitle-agent.labels" . | nindent 4 }}
  {{- if $isRuntimeSecretRef }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-20"
    # See datadog-proxy-configmap.yaml — recreated empty so a v1 -> v2 token cannot
    # leave the previous shape's vars behind.
    helm.sh/hook-delete-policy: before-hook-creation
  {{- end }}
# data, not stringData: stringData is write-only, so Helm's merge cannot remove keys and
# a token upgraded from v1 to v2 would leave the previous shape's vars behind.
{{- if $isRuntimeSecretRef }}
# Populated by hook-extract-job.yaml when the token turns out to be routing v2.
# Ordering invariant: the Job must fully populate this Secret BEFORE it patches the
# api-key in datadog-secret.yaml. Under v2 that key IS the clientSecret, and Helm does
# not undo hook side-effects — a Job that fails between the two writes would leave the
# credential live with this Secret still empty, so the Datadog agent would send
# clientSecret to datadoghq.com on the next pod restart.
data: {}
{{- else }}
data:
  # One override per pipeline: DD_DD_URL covers only metrics, checks and metadata.
  DD_DD_URL: {{ $origin | b64enc | quote }}
  DD_PROCESS_CONFIG_PROCESS_DD_URL: {{ $origin | b64enc | quote }}
  # host:port, NOT a URL — a scheme makes the logs agent refuse to start.
  DD_LOGS_CONFIG_LOGS_DD_URL: {{ printf "%s:443" $host | b64enc | quote }}
  # Logs default to a raw TLS socket, which cannot be reverse-proxied.
  DD_LOGS_CONFIG_USE_HTTP: {{ "true" | b64enc | quote }}
{{- end }}
{{- end }}
