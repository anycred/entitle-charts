# Secret with proxy env vars — shared by DaemonSet (via envFrom) and Sidecar (via envFrom)
# A Secret, not a ConfigMap: the values carry the proxy token.
# datadog.routingMode selects the shape — see values.yaml.
{{- $routing := include "entitle-agent.extractedRouting" . -}}
{{- $entitleUrl := include "entitle-agent.entitleUrlWithCredentials" . -}}
{{- $reverse := include "entitle-agent.datadogReverseMode" . -}}
{{- if and $routing (ne $routing "v0") $entitleUrl }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "entitle-agent.fullname" . }}-datadog-routing
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "entitle-agent.labels" . | nindent 4 }}
# data, not stringData: stringData is write-only, so Helm's merge cannot remove keys and
# a routingMode switch would leave the previous mode's vars behind.
data:
{{- if $reverse }}
  {{- $host := include "entitle-agent.entitleHost" . }}
  {{- $origin := printf "https://%s" $host }}
  # One override per pipeline: DD_DD_URL covers only metrics, checks and metadata.
  DD_DD_URL: {{ $origin | b64enc | quote }}
  DD_PROCESS_CONFIG_PROCESS_DD_URL: {{ $origin | b64enc | quote }}
  # host:port, NOT a URL — a scheme makes the logs agent refuse to start.
  DD_LOGS_CONFIG_LOGS_DD_URL: {{ printf "%s:443" $host | b64enc | quote }}
  # Logs default to a raw TLS socket, which cannot be reverse-proxied.
  DD_LOGS_CONFIG_USE_HTTP: {{ "true" | b64enc | quote }}
{{- else }}
  # DD-specific proxy vars — only affects the Datadog agent's own outbound traffic
  # (metrics, logs, APM → datadoghq.com). Internal checks (kubelet, kube API) use
  # standard HTTP libs (requests/urllib3) which are NOT proxied.
  DD_PROXY_HTTP: {{ $entitleUrl | b64enc | quote }}
  DD_PROXY_HTTPS: {{ $entitleUrl | b64enc | quote }}
{{- end }}
{{- end }}
