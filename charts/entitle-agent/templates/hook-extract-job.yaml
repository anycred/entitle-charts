{{/*
Pre-install/upgrade hook Job: reads the secretRef token, extracts
imageCredentials + datadogApiKey, and patches the placeholder secrets
(docker-login.yaml and datadog-secret.yaml) with real values.

Only runs when agent.secretRef.name is set and agent.token is not provided.
The referenced secret must exist before the chart is deployed.
*/}}
{{- $hasToken := and .Values.agent.token (ne .Values.agent.token "MISSING_CUSTOMER_DATA") -}}
{{- $secretRefName := include "entitle-agent.secretRefNameValue" . -}}
{{- if and $secretRefName (not $hasToken) }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "entitle-agent.fullname" . }}-extract-pull-secret
  labels:
    {{- include "entitle-agent.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "0"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "entitle-agent.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "entitle-agent.fullname" . }}-hook
      restartPolicy: Never
      imagePullSecrets:
        - name: {{ include "entitle-agent.imagePullSecretName" . }}
      containers:
      - name: extract
        image: {{ include "entitle-agent.hookImage" . }}
        # The image defaults to root; the hooks need no privileges.
        securityContext:
          runAsNonRoot: true
          runAsUser: 1001
        command: ["/bin/bash", "-c"]
        args:
        - |
          set -e
          {{- include "entitle-agent.runtimeJsonHelpers" . | nindent 10 }}

          NAMESPACE=$(cat /var/run/secrets/kubernetes.io/serviceaccount/namespace)

          echo "Reading token from secret {{ $secretRefName }}"

          # Read the token JSON from the mounted secret file
          TOKEN_JSON=$(cat "/secret/{{ include "entitle-agent.agentSecretKey" . }}")

          # Unwrap BASE64_CONFIGURATION to get the raw token blob.
          # Parse with a real JSON parser (jget, python3) so it is robust to JSON
          # whitespace, newlines and key ordering — a plain sed regex is not.
          B64_CONFIG=$(echo "$TOKEN_JSON" | jget BASE64_CONFIGURATION)

          if [ -z "$B64_CONFIG" ]; then
            echo "ERROR: Could not extract BASE64_CONFIGURATION from secret"
            exit 1
          fi

          # Decode to get the full token JSON
          FULL_TOKEN=$(echo "$B64_CONFIG" | base64 -d)

          ROUTING=$(echo "$FULL_TOKEN" | jget routing)
          PLATFORM=$(echo "$FULL_TOKEN" | jget platform)
          CLIENT_SECRET=$(echo "$FULL_TOKEN" | jget clientSecret)
          {{- include "entitle-agent.runtimeRoutingVersion" . | nindent 10 }}

          echo "Routing: $ROUTING"
          echo "Platform: $PLATFORM"

          # --- Validate the routing inputs before anything is written ---
          # Every patch below either writes a credential or writes the routing that
          # decides where that credential is sent, and Helm does not undo hook
          # side-effects. A check that can exit 1 between those two writes would leave
          # the Datadog key set to clientSecret with no DD_*_URL to redirect it, so the
          # agent would ship clientSecret to datadoghq.com on the next pod restart.
          # Everything that can fail therefore fails here, before the first patch.
          if [ "$ROUTING_VER" -ge 1 ]; then
            if [ -z "$PLATFORM" ]; then
              echo "ERROR: routing=$ROUTING but platform field is missing. Cannot determine the agent gateway."
              echo "Monitoring would silently stop reporting, so the install is stopped here instead."
              exit 1
            fi
            {{- include "entitle-agent.runtimeProxyHost" . | nindent 12 }}
          fi

          # agent.platform only picks the gateway this Job's image is pulled through; the agent
          # image and Datadog follow the token's platform. A mismatch that got this far pulled
          # fine, so nothing breaks — warn instead of failing a working install. (A mismatch
          # behind a gateway-only firewall never reaches this line: the pull itself fails.)
          VALUES_PLATFORM="{{ include "entitle-agent.agentPlatformValue" . | trim }}"
          if [ -n "$VALUES_PLATFORM" ] && [ -n "$PLATFORM" ] && [ "$VALUES_PLATFORM" != "$PLATFORM" ]; then
            echo "WARNING: agent.platform=$VALUES_PLATFORM does not match the token's platform ($PLATFORM)."
            echo "Set --set agent.platform=$PLATFORM, or the next install behind a gateway-only firewall will fail to pull this Job's image."
          fi

          if [ "$ROUTING_VER" -ge 2 ] && [ -z "$CLIENT_SECRET" ]; then
            echo "ERROR: routing=$ROUTING but the token has no clientSecret. Cannot configure monitoring."
            exit 1
          fi

          # --- Patch docker-login secret ---
          {{- $hasImageCreds := and .Values.imageCredentials (ne .Values.imageCredentials "MISSING_CUSTOMER_DATA") }}
          {{- $imagePullSecretName := include "entitle-agent.imagePullSecretNameValue" . }}
          {{- if not (or $imagePullSecretName $hasImageCreds) }}
          IMAGE_CREDS=$(echo "$FULL_TOKEN" | jget imageCredentials)

          # Extract imageCredentials and patch the docker-login secret.
          # Note: The pull secret is initially keyed to the upstream registry host.
          # If routing v1 is active, the hook-patch-image-job.yaml hook (runs post-install)
          # will re-key it to the proxy host after patching the Deployment's image.
          if [ -n "$IMAGE_CREDS" ]; then
            echo "Patching docker-login secret with extracted imageCredentials"
            kubectl patch secret "{{ include "entitle-agent.fullname" . }}-docker-login" \
              -n "$NAMESPACE" \
              --type merge \
              -p "{\"data\":{\".dockerconfigjson\":\"${IMAGE_CREDS}\"}}"
          elif [ -n "$CLIENT_SECRET" ]; then
            # Routing v2: no imageCredentials by design. The post-install hook-patch-image
            # Job builds the secret from clientSecret once it knows the proxy host.
            echo "No imageCredentials in token (routing v2) - the post-install hook will build the pull secret from clientSecret."
          else
            echo "WARNING: No imageCredentials found in token."
          fi
          {{- else }}
          echo "Skipping docker-login (imagePullSecret.name or imageCredentials provided)"
          {{- end }}

          # --- Fill the routing resource the render-time path cannot build ---
          # Both were created empty by the pre-install hooks in datadog-proxy-configmap.yaml
          # and datadog-routing-secret.yaml, because the routing version is only knowable
          # once this Job has read the token. Fill exactly the one this token calls for;
          # the other stays empty and contributes nothing through its optional envFrom.
          # This runs before the api-key patch so the destination always exists before
          # the credential that is only safe to send to that destination.
          if [ "$ROUTING_VER" -ge 2 ]; then
            echo "Populating datadog-routing secret for agent gateway: $PROXY_HOST"
            # host:port for logs, NOT a URL — a scheme makes the logs agent refuse to start.
            # Same keys as datadog-routing-secret.yaml, including the fail-closed DD_PROXY_* dead end.
            DD_URL_B64=$(printf 'https://%s' "$PROXY_HOST" | base64 -w0)
            DD_LOGS_B64=$(printf '%s:443' "$PROXY_HOST" | base64 -w0)
            DD_HTTP_B64=$(printf 'true' | base64 -w0)
            DD_DEADEND_B64=$(printf 'http://127.0.0.1:9' | base64 -w0)
            DD_GATEWAY_B64=$(printf '%s' "$PROXY_HOST" | base64 -w0)
            kubectl patch secret "{{ include "entitle-agent.fullname" . }}-datadog-routing" \
              -n "$NAMESPACE" \
              --type merge \
              -p "{\"data\":$(jobj \
                DD_DD_URL="$DD_URL_B64" \
                DD_PROCESS_CONFIG_PROCESS_DD_URL="$DD_URL_B64" \
                DD_REMOTE_CONFIGURATION_RC_DD_URL="$DD_URL_B64" \
                DD_LOGS_CONFIG_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_LOGS_CONFIG_USE_HTTP="$DD_HTTP_B64" \
                DD_DATABASE_MONITORING_METRICS_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_DATABASE_MONITORING_SAMPLES_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_DATABASE_MONITORING_ACTIVITY_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_NETWORK_DEVICES_METADATA_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_NETWORK_DEVICES_NETFLOW_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_NETWORK_DEVICES_SNMP_TRAPS_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_NETWORK_PATH_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_CONTAINER_LIFECYCLE_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_CONTAINER_IMAGE_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_SBOM_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_GENRESOURCES_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_SYNTHETICS_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_DATA_STREAMS_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_NETWORK_DEVICES_CONFIG_MANAGEMENT_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_AGENT_TELEMETRY_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_CONFIG_FILES_DISCOVERY_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_DATA_OBSERVABILITY_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_EVENT_MANAGEMENT_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_KUBEACTIONS_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_SDS_RESULT_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_SOFTWARE_INVENTORY_FORWARDER_LOGS_DD_URL="$DD_LOGS_B64" \
                DD_PROXY_HTTP="$DD_DEADEND_B64" \
                DD_PROXY_HTTPS="$DD_DEADEND_B64" \
                DD_PROXY_NO_PROXY="$DD_GATEWAY_B64" \
                DD_NO_PROXY_NONEXACT_MATCH="$DD_HTTP_B64")}"
          elif [ "$ROUTING_VER" -ge 1 ]; then
            echo "Populating datadog-proxy configmap for agent gateway: $PROXY_HOST"
            kubectl patch configmap "{{ include "entitle-agent.fullname" . }}-datadog-proxy" \
              -n "$NAMESPACE" \
              --type merge \
              -p "{\"data\":$(jobj \
                DD_PROXY_HTTP="http://${PROXY_HOST}:8080" \
                DD_PROXY_HTTPS="http://${PROXY_HOST}:8080")}"
          else
            echo "Routing is v0 or absent (found: '$ROUTING'). Datadog talks to datadoghq.com directly."
          fi

          # --- Patch datadog secret ---
          # Under routing v2 the client secret IS the Datadog API key: the agent talks to
          # the Entitle proxy as an origin server, which authenticates on that value and
          # swaps in the real Datadog key. Mirrors entitle-agent.datadogApiKey, which does
          # the same resolution on the render-time path. Last write in the Job: by now the
          # routing that keeps clientSecret off datadoghq.com is already in place.
          DD_API_KEY=$(echo "$FULL_TOKEN" | jget datadogApiKey)

          if [ "$ROUTING_VER" -ge 2 ]; then
            DD_API_KEY="$CLIENT_SECRET"
          fi

          if [ -n "$DD_API_KEY" ]; then
            echo "Patching datadog secret with extracted datadogApiKey"
            kubectl patch secret "{{ include "entitle-agent.fullname" . }}-datadog-secret" \
              -n "$NAMESPACE" \
              --type merge \
              -p "{\"stringData\":{\"api-key\":\"${DD_API_KEY}\"}}"
          else
            echo "WARNING: No datadogApiKey found in token."
          fi

          echo "Done."
        volumeMounts:
        - name: token-secret
          mountPath: /secret
          readOnly: true
      volumes:
      - name: token-secret
        secret:
          secretName: {{ $secretRefName }}
{{- end }}
