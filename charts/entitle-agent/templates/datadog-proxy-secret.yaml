# Secret with the Datadog agent's proxy env vars — consumed by both the sidecar
# (deployment.yaml) and the DaemonSet (subchart values) via envFrom.
#
# A Secret rather than a ConfigMap since chart v2.12.0: the values carry the proxy token,
# and a ConfigMap is plaintext to anyone with namespace read access (kubectl get cm), to
# `helm get values`, and in GitOps diffs.
#
# Two mutually exclusive modes, selected by datadog.proxyMode:
#
#   connect (default)
#     DD_PROXY_HTTP/HTTPS point at the proxy. The agent keeps https:// destinations, so
#     each one becomes a CONNECT tunnel that Envoy authenticates but cannot look inside.
#     The Datadog API key stays in the customer's cluster, because Envoy cannot inject
#     into a tunnel.
#
#   reverse
#     DD_*_URL point at the proxy, which acts as the origin server for Datadog — the same
#     pattern the container registry already uses. Requests are readable, so Envoy swaps
#     the proxy token for the real API key and the cluster never holds a Datadog key.
#     DD_PROXY_* must NOT be set here: with DD_DD_URL already pointing at the proxy, the
#     agent would proxy its way to the proxy.
#     Requires datadogIntake.enabled on the envoy-proxy chart.
#
# reverse additionally requires the token's routing to be v2. routing is what tells the
# chart which proxy contract the platform is on, so v0 and v1 tokens keep their existing
# behaviour byte for byte even if proxyMode is set — a customer on an older token cannot
# be switched into a mode the proxy may not be configured for.
{{- $routing := include "entitle-agent.extractedRouting" . -}}
{{- $proxyUrl := include "entitle-agent.proxyUrlWithCredentials" . -}}
{{- $proxyToken := include "entitle-agent.extractedProxyToken" . | trim -}}
{{- $reverse := and (eq (.Values.datadog.proxyMode | default "connect") "reverse") (eq $routing "v2") $proxyToken -}}
{{- if and $routing (ne $routing "v0") $proxyUrl }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "entitle-agent.fullname" . }}-datadog-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "entitle-agent.labels" . | nindent 4 }}
# data, not stringData, deliberately. stringData is write-only: the API server folds it
# into data and drops it, so on upgrade Helm's three-way merge compares manifests that
# never mention data and cannot work out that a key has gone. Switching proxyMode left the
# previous mode's variables behind — a cluster moving connect -> reverse ended up with both
# DD_DD_URL and DD_PROXY_*, i.e. the agent proxying its way to the proxy. Declaring data
# makes the key set explicit, so removals are applied.
data:
{{- if $reverse }}
  {{- $origin := printf "https://%s" (include "entitle-agent.proxyHost" .) }}
  # The proxy is the origin server for each pipeline. The agent uses a different upstream
  # hostname per pipeline, so every one needs its own override — DD_DD_URL alone only
  # covers metrics, service checks and metadata.
  DD_DD_URL: {{ $origin | b64enc | quote }}
  DD_LOGS_CONFIG_LOGS_DD_URL: {{ $origin | b64enc | quote }}
  DD_PROCESS_CONFIG_PROCESS_DD_URL: {{ $origin | b64enc | quote }}
  # Logs default to a raw TLS socket (logs_config.use_http: false), which cannot be
  # reverse-proxied. HTTP transport is required for them to reach the proxy at all.
  DD_LOGS_CONFIG_USE_HTTP: {{ "true" | b64enc | quote }}
{{- else }}
  # DD-specific proxy vars — only affects the Datadog agent's own outbound traffic
  # (metrics, logs, APM → datadoghq.com). Internal checks (kubelet, kube API) use
  # standard HTTP libs (requests/urllib3) which are NOT proxied.
  DD_PROXY_HTTP: {{ $proxyUrl | b64enc | quote }}
  DD_PROXY_HTTPS: {{ $proxyUrl | b64enc | quote }}
{{- end }}
{{- end }}
