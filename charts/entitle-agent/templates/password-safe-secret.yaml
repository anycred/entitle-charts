{{- if eq .Values.kmsType "password_safe" }}
{{- $passwordSafe := dig "passwordSafe" dict (.Values.externalKmsParams | default dict) }}
apiVersion: v1
kind: Secret
type: Opaque
metadata:
  name: {{ include "entitle-agent.fullname" . }}-password-safe-secret
  labels:
  {{- include "entitle-agent.labels" . | nindent 4 }}
stringData:
  PASSWORD_SAFE_KMS_URL: {{ required "externalKmsParams.passwordSafe.url is required when kmsType is password_safe" $passwordSafe.url | quote }}
  PASSWORD_SAFE_KMS_CLIENT_ID: {{ required "externalKmsParams.passwordSafe.clientId is required when kmsType is password_safe" $passwordSafe.clientId | quote }}
  PASSWORD_SAFE_KMS_CLIENT_SECRET: {{ required "externalKmsParams.passwordSafe.clientSecret is required when kmsType is password_safe" $passwordSafe.clientSecret | quote }}
{{- end }}
