# ConfigMap with proxy env vars — shared by DaemonSet (via envFrom) and Sidecar (via envFrom)
# URL is dynamically generated from token: http://agent.{platform}.entitle.io:8080
# Pre-v2 tokens only. Nothing here is sensitive: the agent tunnels to Datadog through the
# proxy and keeps the real Datadog API key locally, so the URL carries no credential.
# Routing v2 is served by datadog-routing-secret.yaml instead — exactly one of the two
# resources exists for any given token. Keeping this name unchanged from v2.11.0 is what
# lets --reuse-values upgrades of a v1 release keep resolving their envFrom.
{{- $ver := include "entitle-agent.routingVersion" . | atoi -}}
{{- $proxyUrl := include "entitle-agent.proxyUrl" . -}}
{{- if and (ge $ver 1) (lt $ver 2) $proxyUrl }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "entitle-agent.fullname" . }}-datadog-proxy
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "entitle-agent.labels" . | nindent 4 }}
data:
  # DD-specific proxy vars — only affects Datadog agent's own outbound traffic
  # (metrics, logs, APM → datadoghq.com). Internal checks (kubelet, kube API)
  # use standard HTTP libs (requests/urllib3) which are NOT proxied.
  DD_PROXY_HTTP: {{ $proxyUrl | quote }}
  DD_PROXY_HTTPS: {{ $proxyUrl | quote }}
{{- end }}
